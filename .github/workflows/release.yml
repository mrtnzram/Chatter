name: Build & Release

# Triggers:
#   - Pushing a version tag like v0.1.0 builds AND publishes a (draft) Release.
#   - "Run workflow" button (workflow_dispatch) builds only, no Release.
#     Use this to test the build before ever cutting a tag.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write  # needed for the release job to create a GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      # PyInstaller freezes for the architecture it runs on — there is no
      # cross-compiling here. macOS therefore needs BOTH runners, or the build
      # will not launch on the other kind of Mac.
      #
      # Runner label notes (they churn — re-check before editing):
      #   macos-15-intel : x86_64. GitHub-hosted Intel macOS, standard/free on
      #                    public repos. Replaces macos-13, which was retired in
      #                    Dec 2025. Available until ~Aug 2027; the successor
      #                    label is macos-26-intel. Deliberately NOT the newest
      #                    Intel image: building on the older OS keeps the
      #                    minimum macOS version low, and Intel Macs in the lab
      #                    are the machines most likely on an older macOS.
      #   macos-14       : arm64 (Apple Silicon). Pinned rather than
      #                    macos-latest for the same backward-compat reason.
      matrix:
        include:
          - os: windows-latest
            artifact: Chatter-windows
          - os: macos-15-intel    # Intel (x86_64)
            artifact: Chatter-macos-intel
            dmg_name: Chatter-Intel
            dmg_volume: Chatter (Intel)
            # Intel Macs run a wide spread of old macOS versions, so hold the
            # bundle's minimum down. kivy/numba sit at 10.15, so this has room.
            max_macos: '12'
          - os: macos-14          # Apple Silicon (arm64)
            artifact: Chatter-macos-apple-silicon
            dmg_name: Chatter-AppleSilicon
            dmg_volume: Chatter (Apple Silicon)
            # Every Apple Silicon Mac runs macOS 11+, and the arm64 numpy/scipy
            # wheels currently floor at 14, so this only guards against drift.
            max_macos: '14'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # No `architecture:` here on purpose — setup-python defaults to the
          # runner's native architecture, which is what PyInstaller freezes for.
          # Pinning x64 would build an Intel app on the arm64 runner.
          python-version: '3.11'

      # numba/llvmlite ship arm64-only wheels on recent macOS releases, so the
      # Intel job must hold them at the last x86_64-capable versions or pip
      # tries to compile llvmlite from source and the job fails. See the
      # constraints file for detail. PIP_CONSTRAINT applies to every pip
      # install that follows in this job.
      - name: Constrain dependencies (Intel macOS only)
        if: matrix.os == 'macos-15-intel'
        run: |
          echo "PIP_CONSTRAINT=$GITHUB_WORKSPACE/chatter_app/constraints-macos-intel.txt" >> "$GITHUB_ENV"

      # numpy and scipy each ship two x86_64 macOS wheels: a low
      # deployment-target build and a macosx_14_0 build. pip prefers the
      # highest tag the runner supports, so on macOS 15 it picks macosx_14_0
      # and the frozen app then refuses to launch on any Intel Mac older than
      # macOS 14 with "the application cannot be opened" — while still building
      # and passing every other check. Fetch the low-target wheels explicitly
      # and install them first; the requirements install below then sees them
      # already satisfied, and the constraints file stops anything upgrading
      # them back. Verified by the "Verify macOS deployment floor" step.
      - name: Install low-deployment-target numpy/scipy (Intel macOS only)
        if: matrix.os == 'macos-15-intel'
        run: |
          set -e
          python -m pip install --upgrade pip
          pip download --only-binary=:all: --no-deps \
            --platform macosx_10_9_x86_64 --platform macosx_10_14_x86_64 \
            --python-version 311 --implementation cp \
            --dest "$RUNNER_TEMP/lowwheels" numpy scipy
          ls -1 "$RUNNER_TEMP/lowwheels"
          pip install "$RUNNER_TEMP"/lowwheels/*.whl

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r chatter_app/requirements_kivy.txt
          pip install pyinstaller pillow

      - name: Install Kivy SDL2/GLEW DLLs (Windows only)
        if: runner.os == 'Windows'
        run: pip install kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle

      - name: Generate Windows icon (Chatter.ico)
        if: runner.os == 'Windows'
        working-directory: chatter_app
        run: |
          python -c "from PIL import Image; Image.open('assets/zebrafinch.png').save('Chatter.ico', sizes=[(16,16),(32,32),(48,48),(256,256)])"

      - name: Generate macOS icon (Chatter.icns)
        if: runner.os == 'macOS'
        working-directory: chatter_app
        run: |
          set -e
          mkdir -p Chatter.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size assets/zebrafinch.png --out "Chatter.iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            sips -z $double $double assets/zebrafinch.png --out "Chatter.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns Chatter.iconset -o Chatter.icns

      - name: Build with PyInstaller
        working-directory: chatter_app
        # KIVY_GL_BACKEND=mock keeps Kivy's build-time provider probe from
        # initializing real OpenGL — the CI runners have no GPU (Windows reports
        # OpenGL 1.1 / GDI Generic) and would otherwise abort the build. This is
        # build-time only; the shipped app uses the real GPU on the user's machine.
        env:
          KIVY_GL_BACKEND: mock
        run: pyinstaller Chatter.spec --noconfirm

      - name: Verify macOS build architecture
        if: runner.os == 'macOS'
        working-directory: chatter_app
        # Fail loudly if the frozen binary is not the architecture this job is
        # supposed to produce — a silently arm64-only release is exactly the bug
        # this matrix exists to prevent.
        run: |
          set -e
          expected=$(uname -m)
          echo "Runner architecture: $expected"
          lipo -info dist/Chatter.app/Contents/MacOS/Chatter
          lipo -info dist/Chatter.app/Contents/MacOS/Chatter | grep -q "$expected"

      # The architecture check above proves the app is x86_64, but an x86_64
      # app built against a too-new SDK still cannot open on older Macs. This
      # is the check that would have caught the macOS 14 floor before release.
      - name: Verify macOS deployment floor
        if: runner.os == 'macOS'
        working-directory: chatter_app
        env:
          MAX_MACOS: ${{ matrix.max_macos }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys

          limit = int(os.environ["MAX_MACOS"])
          worst, worst_file = 0, None

          for path in pathlib.Path("dist/Chatter.app").rglob("*"):
              if not path.is_file() or path.suffix not in (".so", ".dylib"):
                  continue
              out = subprocess.run(
                  ["otool", "-l", str(path)], capture_output=True, text=True
              ).stdout
              lines = out.splitlines()
              for i, line in enumerate(lines):
                  if "LC_BUILD_VERSION" not in line:
                      continue
                  for follow in lines[i : i + 6]:
                      if "minos" in follow:
                          major = int(follow.split()[1].split(".")[0])
                          if major > worst:
                              worst, worst_file = major, path
                          break
                  break

          print(f"Highest minimum macOS in bundle: {worst} ({worst_file})")
          if worst > limit:
              print(
                  f"::error::Bundle requires macOS {worst}, but this job's limit "
                  f"is {limit}. Users on older macOS will get 'the application "
                  f"cannot be opened'. Culprit: {worst_file}"
              )
              sys.exit(1)
          PY

      - name: Package macOS app as a .dmg
        if: runner.os == 'macOS'
        working-directory: chatter_app
        # Stage the .app next to an /Applications shortcut, then build a
        # compressed .dmg with the built-in hdiutil (no extra dependencies).
        # Users open the .dmg and drag Chatter into Applications — a single
        # download, no unzipping.
        run: |
          set -e
          mkdir -p dmg_stage
          ditto dist/Chatter.app "dmg_stage/Chatter.app"
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "${{ matrix.dmg_volume }}" -srcfolder dmg_stage \
            -ov -format UDZO "dist/${{ matrix.dmg_name }}.dmg"

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: chatter_app/dist/Chatter.exe
          if-no-files-found: error

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: chatter_app/dist/${{ matrix.dmg_name }}.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
