[project]
name = "chatter"
version = "1.0.5"
description = "Semi-automatic bout segmentation from bird song recordings using acoustic features (Spectral Flux, RMS Energy, MFCCs)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "librosa",
    "scipy",
    "scikit-learn",
    "soundfile",
    "joblib",
    "duckdb",
    "jupyterlab",
    "ipywidgets",
    "ipympl",
    "notebook",
]

[project.optional-dependencies]
# BirdNET classification is opt-in (use_birdnet=True). Kept out of the base
# install so the default environment stays light.
birdnet = [
    "birdnetlib",
    "tensorflow",
]

[tool.uv]
package = false
